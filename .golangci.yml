version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - revive
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - nilerr
    - errorlint
    - rowserrcheck
    - sqlclosecheck

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
    errcheck:
      check-type-assertions: true

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [errcheck, unparam, unused]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/CaliLuke/earwig
