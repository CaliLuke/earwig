name: Security

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - helpers/claude-reader/package.json
      - helpers/claude-reader/package-lock.json
      - scripts/verify-security
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: helpers/claude-reader/package-lock.json
      - name: Audit dependencies
        run: ./scripts/verify-security
