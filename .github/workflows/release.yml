name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: helpers/claude-reader/package-lock.json
      - name: Install helper dependencies
        run: npm ci --prefix helpers/claude-reader
      - name: Install pinned quality tools
        run: ./scripts/install-dev-tools
      - name: Verify release source
        run: ./scripts/verify
      - name: Audit release dependencies
        run: ./scripts/verify-security

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: helpers/claude-reader/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Validate native runner
        run: |
          test "$(go env GOHOSTOS)" = "${{ matrix.os }}"
          test "$(go env GOHOSTARCH)" = "${{ matrix.arch }}"
      - name: Install helper dependencies
        run: npm ci --prefix helpers/claude-reader
      - name: Build release archive
        run: ./scripts/package-release "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: earwig-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: earwig-*
          path: dist
          merge-multiple: true
      - name: Assemble checksums and Homebrew formula
        run: |
          cat dist/*.sha256 | sort -k2 > dist/checksums.txt
          test "$(wc -l < dist/checksums.txt)" -eq 4
          ./scripts/render-homebrew-formula "${GITHUB_REF_NAME}" dist/checksums.txt > dist/earwig.rb
          ruby -c dist/earwig.rb
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.tar.gz"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
            dist/earwig.rb
      - name: Update CaliLuke/homebrew-tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          test -n "${TAP_DEPLOY_KEY}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${TAP_DEPLOY_KEY}" > ~/.ssh/homebrew_tap
          chmod 0600 ~/.ssh/homebrew_tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/homebrew_tap -o IdentitiesOnly=yes"
          git clone git@github.com:CaliLuke/homebrew-tap.git tap
          cp dist/earwig.rb tap/Formula/earwig.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/earwig.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Earwig to ${GITHUB_REF_NAME}"
          git push origin main
